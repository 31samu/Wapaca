name: Release download

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Test public build configuration
        run: npm run test:build

      - name: Package and verify public app
        run: npm run package:release

      - name: Attach download and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" output/releases/*.zip output/releases/*.sha256 --clobber
